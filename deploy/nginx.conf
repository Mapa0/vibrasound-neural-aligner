# Dedicated virtual host. This server uses a pre-existing SNI stream proxy
# on port 443 which forwards ordinary HTTPS traffic to localhost:4443.
server {
    listen 80;
    listen [::]:80;
    server_name vibrasound.mapazero.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }
    location / {
        return 301 https://vibrasound.mapazero.com$request_uri;
    }
}

server {
    listen 127.0.0.1:4443 ssl http2;
    listen [::1]:4443 ssl http2;
    server_name vibrasound.mapazero.com;

    ssl_certificate /etc/letsencrypt/live/vibrasound.mapazero.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vibrasound.mapazero.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/vibrasound;
    index index.html;
    port_in_redirect off;
    charset utf-8;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control "no-cache" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
